<!doctype html>
<html lang="en"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,user-scalable=no">
<meta name="apple-mobile-web-app-capable" content="yes">
<title>Body Practice</title>
<style>
:root{--bg:#1e2126;--fg:#e8eaed;--ac:#5aa9ff;--card:#2b3038}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;height:100%;background:var(--bg);color:var(--fg);font:16px system-ui,sans-serif;overflow:hidden;touch-action:none}
#menu{position:fixed;inset:0;display:grid;place-content:center;gap:14px;padding:env(safe-area-inset-top) 16px;grid-template-columns:repeat(auto-fit,minmax(200px,260px));justify-content:center;overflow:auto}
#menu h1{grid-column:1/-1;text-align:center;font-weight:600}
.card{background:var(--card);border:1px solid #3d4450;border-radius:12px;padding:22px 14px;text-align:center;cursor:pointer;font-size:18px}
.card:active{background:#38404c}.card small{display:block;opacity:.55;margin-top:6px;font-size:12px}
#view{position:fixed;inset:0;display:none}
canvas{display:block;width:100%;height:100%}
#bar{position:fixed;left:0;right:0;top:0;display:none;gap:8px;padding:calc(env(safe-area-inset-top) + 8px) 10px 8px;align-items:center;z-index:5}
#bar b{flex:1;text-align:center;text-shadow:0 1px 3px #000}
button{background:#2b3038cc;color:var(--fg);border:1px solid #4a5260;border-radius:8px;padding:10px 14px;font-size:15px}
button.on{background:var(--ac);color:#001}
#note{position:fixed;left:0;right:0;bottom:calc(env(safe-area-inset-bottom) + 12px);text-align:center;opacity:.6;font-size:13px;display:none}
</style></head><body>
<div id="menu"></div>
<div id="view"></div>
<div id="bar"><button id="back">‹ Back</button><b id="title"></b><button id="persp">Perspective</button><button id="light">Light</button><button id="reset">Reset</button></div>
<div id="note"></div>
<script type="importmap">{"imports":{"three":"https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.module.js","three/addons/":"https://cdn.jsdelivr.net/npm/three@0.160.0/examples/jsm/"}}</script>
<script type="module" src="app.js"></script>
</body></html>
