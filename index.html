<!doctype html>
<html lang="en"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,user-scalable=no">
<meta name="apple-mobile-web-app-capable" content="yes">
<title>Body Practice</title>
<style>
:root{--bg:#1e2126;--fg:#e8eaed;--ac:#5aa9ff;--card:#2b3038}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;height:100%;background:var(--bg);color:var(--fg);font:16px system-ui,sans-serif;overflow:hidden;touch-action:none}
#menu{position:fixed;inset:0;display:grid;place-content:center;gap:14px;padding:env(safe-area-inset-top) 16px;grid-template-columns:repeat(auto-fit,minmax(200px,260px));justify-content:center;overflow:auto}
#menu h1{grid-column:1/-1;text-align:center;font-weight:600}
.card{background:var(--card);border:1px solid #3d4450;border-radius:12px;padding:22px 14px;text-align:center;cursor:pointer;font-size:18px}
.card:active{background:#38404c}.card small{display:block;opacity:.55;margin-top:6px;font-size:12px}
#view{position:fixed;inset:0;display:none}
canvas{display:block;width:100%;height:100%}
#bar{position:fixed;left:0;right:0;top:0;display:none;gap:8px;padding:calc(env(safe-area-inset-top) + 8px) 10px 8px;align-items:center;z-index:5}
#bar b{flex:1;text-align:center;text-shadow:0 1px 3px #000}
button{background:#2b3038cc;color:var(--fg);border:1px solid #4a5260;border-radius:8px;padding:10px 14px;font-size:15px}
button.on{background:var(--ac);color:#001}
#pp,#sp{position:fixed;left:0;right:0;bottom:calc(env(safe-area-inset-bottom) + 10px);display:none;gap:10px;justify-content:center;align-items:center;flex-wrap:wrap;padding:0 10px;z-index:5}#hp,#sp{display:none;position:fixed;right:8px;top:calc(env(safe-area-inset-top) + 60px);bottom:auto;left:auto;width:290px;max-height:calc(100% - 120px);overflow:auto;flex-direction:column;align-items:stretch;background:#1e2126cc;border-radius:10px;padding:8px}#hp .row,#sp .row{display:flex;flex-wrap:wrap;gap:6px;justify-content:center}#hlist{display:none;flex-direction:column;gap:4px}#hlist button{text-align:left}#pad{width:100%;background:#262b33;border:1px solid #4a5260;border-radius:6px;touch-action:none}#sc label{display:block;margin:6px 0}#sc input{width:100%}#minis svg{width:130px;height:130px;background:#262b33;border:1px solid #4a5260;border-radius:6px}#pl{display:flex;gap:6px}#pl button{border-width:3px}#hp label,#pp label,#sp label{background:#2b3038cc;border:1px solid #4a5260;border-radius:8px;padding:8px 12px;font-size:14px}#hp input,#pp input,#sp input{vertical-align:middle;width:120px;touch-action:auto}
#note{position:fixed;left:0;right:0;bottom:calc(env(safe-area-inset-bottom) + 12px);text-align:center;opacity:.6;font-size:13px;display:none}
</style></head><body>
<div id="menu"></div>
<div id="view"></div>
<div id="bar"><button id="back">‹ Back</button><b id="title"></b><button id="persp">Perspective</button><button id="light">Light</button><button id="reset">Reset</button></div>
<div id="pp"><button id="blocks">Blocks</button><label>Width <input id="sw" type="range" min="0.1" max="1" step="0.01" value="0.5"></label><label>Height <input id="sh" type="range" min="0.1" max="1" step="0.01" value="0.5"></label><button id="rand">Random</button><button id="zero">Zero</button></div>
<div id="sp"><div class="row"><button id="m0" class="on">Points/Lines</button><button id="m1">Cylinder</button><button id="m2">Block</button><button id="free">3D drag</button></div>
<div class="row"><button id="bop" class="on">Operate</button><button id="bsh">Show</button><button id="rst">Reset</button></div>
<label>Wireframe opacity <input id="po" type="range" min="0" max="1" step="0.02" value="1"></label>
<div id="op"><div class="row" id="pbtn"></div><svg id="pad" viewBox="-200 -200 400 400"></svg><div id="sc"></div></div>
<div id="sh" style="display:none"><div class="row" id="minis"></div></div></div>
<div id="hp"><button id="hmode">Loomis Head ▾</button><div id="hlist"></div><label>Steps <input id="hs" type="range" min="0" max="1" step="0.01" value="0"></label><div class="row"><button id="hzb">Markers</button><button id="hma">Light/Dark</button></div><label>Wireframe opacity <input id="hop" type="range" min="0" max="1" step="0.02" value="1"></label></div>
<div id="note"></div>
<script type="importmap">{"imports":{"three":"https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.module.js","three/addons/":"https://cdn.jsdelivr.net/npm/three@0.160.0/examples/jsm/"}}</script>
<script type="module" src="app.js"></script>
</body></html>
